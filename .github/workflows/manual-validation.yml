name: Manual public-project validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate public source without GPU or privileged operations
        shell: pwsh
        run: ./scripts/Validate-PublicProject.ps1
